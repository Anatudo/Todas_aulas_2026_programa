<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Tabela</title>
    <style>
       table, td, tr, th{
            border: solid 1px blue;
       } 
    </style>
</head>

<body>
    <table> <!-- border é um atributo obsoleto, deve-se utilizar css -->
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Nota</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Fulano</td>
                <td>8.5</td>
            </tr>
            <tr>

                <td>Sicrana</td>
                <td>9.0</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2"><strong>Minha Tabela</strong></td>
            </tr>
        </tfoot>
    </table>
    <a href="../index.html" class="botao">aqui</a>
        <style>
            .botao {
  display: inline-block;
  padding: 12px 24px;
  background: linear-gradient(135deg, #5a2d82, #2d1b4e); /* roxo elegante */
  color: #fff;
  font-weight: bold;
  text-decoration: none;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

.botao:hover {
  background: #ffd700;   /* dourado no hover */
  color: #000;
  transform: scale(1.05); /* leve aumento ao passar o mouse */
}
</style>
</body>

</html>
